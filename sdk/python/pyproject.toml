[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wristbeam-client"
version = "0.1.0"
description = "Read-only REST/MCP client and webhook verification for WristBeam"
requires-python = ">=3.9"
license = {text = "MIT"}

[tool.setuptools.packages.find]
where = ["."]
include = ["wristbeam*"]
