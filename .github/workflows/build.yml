name: macOS build
on:
  workflow_call:
    inputs:
      release-tag:
        type: string
        default: ''
permissions:
  contents: read
jobs:
  macos:
    name: ${{ matrix.label }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            label: macOS 14 · Apple Silicon
            arch: arm64
            artifact: package-macos14-arm64
          - runner: macos-15
            label: macOS 15 · Apple Silicon
            arch: arm64
            artifact: release-arm64
          - runner: macos-15-intel
            label: macOS 15 · Intel
            arch: x86_64
            artifact: release-x86_64
          - runner: macos-26
            label: macOS 26 · Apple Silicon
            arch: arm64
            artifact: package-macos26-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate architecture and version
        env:
          PULSE_EXPECTED_ARCH: ${{ matrix.arch }}
          PULSE_RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          test "$(uname -m)" = "$PULSE_EXPECTED_ARCH"
          python3 scripts/check-release.py --tag "$PULSE_RELEASE_TAG"
          swift --version
      - name: Core regression checks
        run: python3 scripts/test-core.py
      - name: Developer HTTP, TLS, MCP, SDK and webhook integration
        run: python3 scripts/test-developer.py
      # Hosted Intel VMs abort in MTLLoader (no usable target GPU). Compile
      # the same views there; execute native rendering on all three ARM images.
      - name: Compile native share and settings views on Intel
        if: matrix.arch == 'x86_64'
        run: |
          python3 scripts/test-dashboard-render.py --compile-only
          python3 scripts/test-interface-render.py --compile-only
      - name: Native share image rendering
        if: matrix.arch == 'arm64'
        run: python3 scripts/test-dashboard-render.py
      - name: Native settings and floating render smoke checks
        if: matrix.arch == 'arm64'
        run: python3 scripts/test-interface-render.py dist/interface-renders
      - name: Render showcase images
        if: matrix.runner == 'macos-15'
        run: |
          mkdir -p dist/showcase
          cp docs/images/raw-menu-bar.png dist/showcase/
          cp dist/interface-renders/menu-en-dark.png dist/showcase/raw-menu-popup.png
          cp dist/interface-renders/menu-zh-dark.png dist/showcase/raw-menu-popup-zh.png
          swiftc -parse-as-library scripts/render-floating-showcase.swift -o dist/render-showcase
          dist/render-showcase dist/interface-renders dist/showcase
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          source, target = Path('dist/interface-renders'), Path('dist/showcase')
          for language in ('zh', 'en'):
              suffix = '-zh' if language == 'zh' else ''
              for theme in ('light', 'dark'):
                  shutil.copy2(source / f'page-overview-{language}-{theme}.png', target / f'dashboard-{theme}{suffix}.png')
              shutil.copy2(source / f'page-overview-{language}-dark.png', target / f'raw-dashboard-{language}.png')
              shutil.copy2(source / f'page-appearance-{language}-dark.png', target / f'display-settings{suffix}.png')
              for mode, theme in (('compact', 'light'), ('detailed', 'dark')):
                  shutil.copy2(source / f'floating-{language}-{theme}-{mode}-100.png', target / f'raw-floating-{mode}-{language}.png')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.runner == 'macos-15'
        with:
          name: showcase-macos15
          path: dist/showcase/*.png
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.runner == 'macos-15'
        with:
          name: native-interface-macos15
          path: dist/interface-renders/*.png
          if-no-files-found: error
          retention-days: 14
      - name: Native XCTest suite
        run: swift test
      - name: Build and sign application
        run: zsh scripts/build.sh
      - name: Validate real signed package
        run: python3 scripts/test-updater.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: dist/WristBeam-macOS-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 14
