name: Release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    name: Release checks
    uses: ./.github/workflows/ci.yml
    with:
      release-tag: ${{ github.ref_name }}
    permissions:
      contents: read
      actions: read
      security-events: write
  publish:
    name: Package and publish
    needs: verify
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist/release
          merge-multiple: true
      - name: Assemble universal application
        env:
          PULSE_RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/package-universal.py --directory dist/release --tag "$PULSE_RELEASE_TAG"
      - name: Check all artifacts and write checksums
        env:
          PULSE_RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/check-release.py --tag "$PULSE_RELEASE_TAG" --directory dist/release --write-manifest
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/release/*.zip
      - name: Publish validated release assets
        env:
          GH_TOKEN: ${{ github.token }}
          PULSE_RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/publish-release.py --directory dist/release --tag "$PULSE_RELEASE_TAG"
