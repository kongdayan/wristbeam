name: CodeQL
on:
  workflow_call:
    inputs:
      swift:
        type: boolean
        default: true
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || inputs.swift) && '{"include":[{"language":"swift","runner":"macos-15-intel","build-mode":"manual"},{"language":"python","runner":"ubuntu-24.04","build-mode":"none"},{"language":"actions","runner":"ubuntu-24.04","build-mode":"none"}]}' || '{"include":[{"language":"python","runner":"ubuntu-24.04","build-mode":"none"},{"language":"actions","runner":"ubuntu-24.04","build-mode":"none"}]}') }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      # CodeQL needs source extraction, not an optimized application binary.
      # Keep Release packaging and both architecture test jobs in build.yml.
      - name: Compile Swift for analysis
        if: matrix.language == 'swift'
        run: python3 scripts/ci-metrics.py measure --name codeql-swift-compile --output codeql-compile-timing.json -- swift build -c debug --disable-index-store
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          category: /language:${{ matrix.language }}
          upload: ${{ startsWith(github.ref, 'refs/tags/') && 'never' || 'always' }}
      - name: Preserve Swift compile timing
        if: ${{ always() && matrix.language == 'swift' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-swift-timing
          path: codeql-compile-timing.json
          if-no-files-found: warn
          retention-days: 7
